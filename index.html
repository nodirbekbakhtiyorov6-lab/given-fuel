<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Handout Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #090b11;
    --bg-gradient: radial-gradient(circle at 100% 0%, rgba(14, 165, 233, 0.15) 0%, transparent 40%), 
                   radial-gradient(circle at 0% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
    --panel: rgba(20, 25, 35, 0.7);
    --panel-2: rgba(30, 38, 51, 0.9);
    --line: rgba(255, 255, 255, 0.1);
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --accent: #0ea5e9;
    --accent-glow: rgba(14, 165, 233, 0.3);
    --given: #10b981;
    --not_yet: #f59e0b;
    --not_available: #ef4444;
    --other: #64748b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height: 100%;}
  body{
    background-color: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:0 16px 90px;
    /* Убрал ломающий фильтр с body */
  }
  .top-bar{height:4px; background: var(--accent); box-shadow: 0 0 15px var(--accent-glow);}
  .wrap{max-width:780px;margin:0 auto;padding-top:40px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:32px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:36px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    margin:0;
    color:var(--text);
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }
  .shift-input{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:10px 14px;
    outline:none;
    width:220px;
    transition: all 0.3s ease;
  }
  .shift-input:focus{
    border-color:var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .shift-input::placeholder{color:var(--text-dim);}

  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .sum-cell{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 12px;
    text-align:center;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    transition: transform 0.2s ease;
  }
  .sum-cell:hover{ transform: translateY(-2px); }
  .sum-num{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700; line-height:1;}
  .sum-label{font-size:12px;font-weight:600;color:var(--text-dim);margin-top:8px;text-transform:uppercase;letter-spacing:0.05em;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:24px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    overflow: hidden;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    font-family: 'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    text-align:left;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  th.col-status, td.col-status{width:180px;}
  th.col-del, td.col-del{width:50px; text-align:center;}
  tbody tr{border-bottom:1px solid var(--line); transition: background 0.2s;}
  tbody tr:hover{background: rgba(255,255,255,0.03);}
  tbody tr:last-child{border-bottom:none;}
  td{padding:12px 18px;vertical-align:middle;}

  .unit-input, .note-input{
    width:100%;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    padding:8px 12px;
    border-radius:6px;
    outline:none;
    transition: all 0.2s;
  }
  .note-input{font-family:'Inter',sans-serif;font-size:14px;}
  .unit-input:focus, .note-input:focus{
    background:var(--panel-2);
    border-color:var(--accent);
  }
  .unit-input:hover:not(:focus), .note-input:hover:not(:focus){
    background:var(--panel-2);
  }

  .status-select{
    width:100%;
    padding:10px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.02em;
    outline:none;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394a3b8'/></svg>");
    padding-right:28px;
    transition: all 0.2s;
  }
  .status-select.st-not_yet{background-color:rgba(245,158,11,.1);border-color:var(--not_yet);color:var(--not_yet);}
  .status-select.st-given{background-color:rgba(16,185,129,.1);border-color:var(--given);color:var(--given);}
  .status-select.st-not_available{background-color:rgba(239,68,68,.1);border-color:var(--not_available);color:var(--not_available);}
  .status-select.st-other{background-color:rgba(100,116,139,.1);border-color:var(--other);color:var(--other);}
  .status-select option{background:#1e293b;color:var(--text);text-transform:none;}

  .del-btn{
    background:rgba(239,68,68,0.1);
    border:none;
    border-radius: 6px;
    color:var(--not_available);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:6px 10px;
    transition: all 0.2s;
    opacity: 0.5;
  }
  tr:hover .del-btn{ opacity: 1; }
  .del-btn:hover{background:var(--not_available); color:#fff; transform: scale(1.05);}

  .actions{display:flex;gap:12px;flex-wrap:wrap;}
  button.action{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:12px 20px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    transition: all 0.2s ease;
  }
  button.action:hover{border-color:var(--text-dim); background:var(--panel);}
  
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    flex:1;
    font-size:15px;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  button.primary:hover{
    background:#0284c7; 
    border-color:#0284c7;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  .save-note{font-size:13px;color:var(--text-dim);margin-top:12px;text-align:center; font-family:'Space Grotesk',sans-serif;}
  .pdf-hint{font-size:13px;color:var(--text-dim);margin-top:12px;text-align:center; font-family:'Inter',sans-serif;}

  /* ---- Print / PDF ---- */
  .print-only{display:none;}

  @media print{
    body *{visibility:hidden;}
    .print-only, .print-only *{visibility:visible;}
    .print-only{
      display:block;
      position:absolute;
      top:0;left:0;
      width:100%;
      background:#fff;
      color:#111;
      padding:10px 20px;
      font-family:Arial, sans-serif;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .print-only h2{font-size:22px;margin:0 0 4px; font-family:sans-serif;}
    .print-only .p-sub{color:#64748b;font-size:13px;margin-bottom:20px;}
    .print-only table{width:100%;border-collapse:collapse;font-size:13px;}
    .print-only th, .print-only td{border:1px solid #cbd5e1;padding:10px 12px;text-align:left;}
    .print-only th{background:#f1f5f9; text-transform:uppercase; font-size:12px; letter-spacing:0.05em;}
    .print-only .badge{display:inline-block;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:bold;color:#fff;text-transform:uppercase;}
    .print-only .p-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
    .print-only .p-sum-cell{border:1px solid #cbd5e1;padding:12px 8px;text-align:center; border-radius:6px;}
    .print-only .p-sum-num{font-size:24px;font-weight:bold;}
    .print-only .p-sum-label{font-size:10px;color:#64748b;text-transform:uppercase;margin-top:4px; font-weight:bold;}
    @page{margin:16mm;}
  }
</style>
</head>
<body>

<div class="top-bar"></div>

<div class="wrap">
  <header>
    <h1>Fuel Handout</h1>
    <input type="text" class="shift-input" id="shiftLabel" placeholder="Shift, e.g. Night 9/14">
  </header>

  <div class="summary" id="summary"></div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>Unit</th>
          <th class="col-status">Status</th>
          <th>Notes</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="actions">
    <button class="action" id="addRowBtn">+ Add Unit</button>
    <button class="action" id="resetBtn">↻ Reset Shift</button>
  </div>
  <br>
  <div class="actions">
    <button class="action primary" id="pdfBtn">Download PDF Report</button>
  </div>
  <p class="pdf-hint">Opens the print dialog — choose "Save as PDF" and save.</p>
  <p class="save-note" id="saveNote">&nbsp;</p>
</div>

<div class="print-only" id="printable"></div>

<script>
  const STATUSES = ['not_yet','given','not_available','other'];
  const STATUS_LABEL = {
    not_yet:'Not yet',
    given:'Given',
    not_available:'Not available',
    other:'Other'
  };
  const STATUS_HEX = {
    not_yet:'#f59e0b',
    given:'#10b981',
    not_available:'#ef4444',
    other:'#64748b'
  };

  let trucks = [];
  let shiftLabel = '';
  let saveTimer = null;

  function defaultTrucks(){
    return Array.from({length:6}, () => ({ id: cryptoId(), unit:'', status:'not_yet', note:'' }));
  }
  function cryptoId(){
    return 't' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
  }

  async function loadData(){
    try{
      const res = await window.storage.get('fuel-board', true);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        trucks = parsed.trucks && parsed.trucks.length ? parsed.trucks : defaultTrucks();
        shiftLabel = parsed.shiftLabel || '';
      } else {
        trucks = defaultTrucks();
      }
    }catch(e){
      trucks = defaultTrucks();
    }
    document.getElementById('shiftLabel').value = shiftLabel;
    render();
  }

  function scheduleSave(){
    document.getElementById('saveNote').textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveData, 500);
  }

  async function saveData(){
    try{
      await window.storage.set('fuel-board', JSON.stringify({ trucks, shiftLabel }), true);
      const now = new Date();
      document.getElementById('saveNote').textContent =
        'Saved · shared with anyone who opens this board · ' +
        now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    }catch(e){
      document.getElementById('saveNote').textContent = 'Save failed';
    }
  }

  function render(){
    renderSummary();
    const tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    trucks.forEach((t) => {
      const tr = document.createElement('tr');

      const tdUnit = document.createElement('td');
      const unitInput = document.createElement('input');
      unitInput.className = 'unit-input';
      unitInput.placeholder = 'unit #';
      unitInput.value = t.unit;
      unitInput.addEventListener('input', e => { t.unit = e.target.value; scheduleSave(); });
      tdUnit.appendChild(unitInput);

      const tdStatus = document.createElement('td');
      tdStatus.className = 'col-status';
      const select = document.createElement('select');
      select.className = 'status-select st-' + t.status;
      STATUSES.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = STATUS_LABEL[s];
        if(s === t.status) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', e => {
        t.status = e.target.value;
        select.className = 'status-select st-' + t.status;
        renderSummary();
        scheduleSave();
      });
      tdStatus.appendChild(select);

      const tdNote = document.createElement('td');
      const noteInput = document.createElement('input');
      noteInput.className = 'note-input';
      noteInput.placeholder = 'note';
      noteInput.value = t.note;
      noteInput.addEventListener('input', e => { t.note = e.target.value; scheduleSave(); });
      tdNote.appendChild(noteInput);

      const tdDel = document.createElement('td');
      tdDel.className = 'col-del';
      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.innerHTML = '&#10005;';
      delBtn.title = 'Remove unit';
      delBtn.addEventListener('click', () => {
        trucks = trucks.filter(x => x.id !== t.id);
        render();
        scheduleSave();
      });
      tdDel.appendChild(delBtn);

      tr.appendChild(tdUnit);
      tr.appendChild(tdStatus);
      tr.appendChild(tdNote);
      tr.appendChild(tdDel);
      tbody.appendChild(tr);
    });
  }

  function renderSummary(){
    const counts = { given:0, not_yet:0, not_available:0, other:0 };
    trucks.forEach(t => counts[t.status]++);
    const summary = document.getElementById('summary');
    summary.innerHTML = '';
    STATUSES.forEach(s => {
      const cell = document.createElement('div');
      cell.className = 'sum-cell';
      cell.innerHTML =
        `<div class="sum-num" style="color:${STATUS_HEX[s]}">${counts[s]}</div>
         <div class="sum-label">${STATUS_LABEL[s]}</div>`;
      summary.appendChild(cell);
    });
  }

  document.getElementById('addRowBtn').addEventListener('click', () => {
    trucks.push({ id: cryptoId(), unit:'', status:'not_yet', note:'' });
    render();
    scheduleSave();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if(!confirm('Reset all statuses to "Not yet"? Units and notes stay.')) return;
    trucks.forEach(t => { t.status = 'not_yet'; t.note = ''; });
    render();
    scheduleSave();
  });

  document.getElementById('shiftLabel').addEventListener('input', e => {
    shiftLabel = e.target.value;
    scheduleSave();
  });

  function escapeHtml(str){
    if(!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildPrintable(){
    const el = document.getElementById('printable');
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US');
    const timeStr = now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});

    const counts = { given:0, not_yet:0, not_available:0, other:0 };
    trucks.forEach(t => counts[t.status]++);
    let summaryHtml = '';
    STATUSES.forEach(s => {
      summaryHtml += `<div class="p-sum-cell">
        <div class="p-sum-num" style="color:${STATUS_HEX[s]}">${counts[s]}</div>
        <div class="p-sum-label">${STATUS_LABEL[s]}</div>
      </div>`;
    });

    let rowsHtml = '';
    trucks.forEach(t => {
      rowsHtml += `<tr>
        <td>${escapeHtml(t.unit) || '—'}</td>
        <td><span class="badge" style="background:${STATUS_HEX[t.status]};">${STATUS_LABEL[t.status]}</span></td>
        <td>${escapeHtml(t.note) || ''}</td>
      </tr>`;
    });

    el.innerHTML = `
      <h2>Fuel Handout — ${escapeHtml(shiftLabel) || 'Shift not set'}</h2>
      <div class="p-sub">Generated ${dateStr}, ${timeStr} · ${trucks.length} units total</div>
      <div class="p-summary">${summaryHtml}</div>
      <table>
        <thead><tr><th>Unit</th><th>Status</th><th>Notes</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
  }

  document.getElementById('pdfBtn').addEventListener('click', () => {
    buildPrintable();
    setTimeout(() => window.print(), 50);
  });

  loadData();
</script>

</body>
</html>
