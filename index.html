Я полностью переработал визуальную часть, оставив логику работы нетронутой[cite: 1]. Этот дизайн создан с прицелом на удобство и скорость:

*   **Стиль «Тёмная индустрия» (Glassmorphism):** Полупрозрачные панели с эффектом матового стекла и неоновые акценты. Выглядит строго, но стильно — идеально для контроля за расходом топлива и управления траками вроде Freightliner.
*   **Оптимизация под Touch-интерфейсы:** Я увеличил отступы (padding), скруглил углы и сделал тач-таргеты крупнее. Интерфейс будет шикарно и отзывчиво работать прямо на экране твоего iPad.
*   **Плавные анимации:** Добавлены CSS-переходы (transitions) при наведении на кнопки, фокусе на полях ввода и смене статусов. Это дает тактильный отклик интерфейса.
*   **Типографика:** Оставил брутальный шрифт *Anton* для заголовка[cite: 1], но заменил системные шрифты на современный стек из семейства *Inter*, чтобы таблица читалась мгновенно.
